<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="TwinOS - 智能决策副驾系统" />
  <title>TwinOS - 你就负责思考，剩下的交给它</title>
  <style>
    /* Loading screen styles */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background-color: #000000;
      color: #ffffff;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loading-logo {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 2rem;
      letter-spacing: 0.1em;
    }

    .loading-text {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: #00ff00;
      margin-bottom: 0.5rem;
      min-height: 1.2rem;
    }

    .loading-cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.2em;
      background-color: #00ff00;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    #root {
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">TWINOS</div>
    <div class="loading-text">System initialization in progress<span class="loading-cursor"></span></div>
  </div>

  <div id="root"></div>

  <script>
    // Simulate loading animation
    const loadingTexts = [
      'System initialization in progress',
      'Establishing secure connection',
      'Loading neural network parameters',
      'Calibrating decision matrix',
      'Syncing with memory banks',
      'System ready'
    ];

    let textIndex = 0;
    const loadingTextElement = document.querySelector('.loading-text');

    function updateLoadingText() {
      if (loadingTextElement && textIndex < loadingTexts.length) {
        loadingTextElement.innerHTML = loadingTexts[textIndex] + '<span class="loading-cursor"></span>';
        textIndex++;
      }
    }

    // Update text every 800ms
    const loadingInterval = setInterval(updateLoadingText, 800);

    // Hide loading screen when app loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.5s ease-out';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }
        clearInterval(loadingInterval);
      }, 3000); // Keep loading screen for at least 3 seconds
    });
  </script>
</body>
</html>
